name: Planner regression
on: [push, pull_request]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.55.0
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Exercise desktop and mobile layouts
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          python -m http.server 8765 --bind 127.0.0.1 &
          python tests/catalog_browser.py
  import-trainee-events:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev/jp-data-catalog'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Cilda/UmaUmaChecker
          ref: 42da047b02dca0282f5fa6500cdca9880656b891
          path: upstream
          sparse-checkout: UmaUmaChecker/Library
          persist-credentials: false
      - run: python scripts/import_trainee_events.py upstream/UmaUmaChecker/Library/Chara.json
      - name: Register verified trainee events on the development branch
        run: |
          git add data/catalog/stories.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m '育成衣装の選択肢・報酬を追加照合'
            git push origin HEAD:dev/jp-data-catalog
          fi
