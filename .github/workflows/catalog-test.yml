name: Planner regression
on: [push, pull_request]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.55.0
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Exercise desktop and mobile layouts
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          python -m http.server 8765 --bind 127.0.0.1 &
          python tests/catalog_browser.py
  inspect-event-data:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Cilda/UmaUmaChecker
          ref: 42da047b02dca0282f5fa6500cdca9880656b891
          sparse-checkout: UmaUmaChecker/Library
          persist-credentials: false
      - name: Inspect character event data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('UmaUmaChecker/Library/Chara.json').read_text())
          for _ in range(6):
              if isinstance(data,dict):
                  print(list(data)[:3],len(data))
                  data=next(iter(data.values()))
              elif isinstance(data,list):
                  print('list',len(data))
                  data=data[0]
              else:
                  print(str(data)[:80])
                  break
          PY
